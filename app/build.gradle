plugins {
    id 'com.android.application'
}

android {
    namespace 'com.follyway.sensiboost'
    compileSdk 34

    defaultConfig {
        applicationId "com.follyway.sensiboost"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    // Если используешь Shizuku через maven, раскомментируй и используй эти строки:
    // implementation 'dev.rikka.shizuku:api:12.1.0'
    // implementation 'dev.rikka.shizuku:provider:12.1.0'
}
